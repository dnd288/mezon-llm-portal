name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [ci]
    environment:
      name: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and deploy to Cloudflare Pages
        id: deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEZON_CLIENT_ID: ${{ secrets.MEZON_CLIENT_ID }}
          MEZON_CLIENT_SECRET: ${{ secrets.MEZON_CLIENT_SECRET }}
          MEZON_REDIRECT_URI: ${{ vars.MEZON_REDIRECT_URI }}
          MEZON_AUTH_URL: ${{ vars.MEZON_AUTH_URL }}
          MEZON_TOKEN_URL: ${{ vars.MEZON_TOKEN_URL }}
          MEZON_USERINFO_URL: ${{ vars.MEZON_USERINFO_URL }}
          NEW_API_BASE_URL: ${{ vars.NEW_API_BASE_URL }}
          NEW_API_ADMIN_TOKEN: ${{ secrets.NEW_API_ADMIN_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_MAX_AGE: ${{ vars.SESSION_MAX_AGE }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
